
services:
  postgres:
    image: postgres:16-alpine
    container_name: star-wars-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: starwars
      POSTGRES_USER: starwars
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U starwars -d starwars"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
